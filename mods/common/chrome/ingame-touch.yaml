Container@TOUCH_CONTROLS:
	Logic: TouchControlsLogic
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Children:
		Container@LEFT_ACTIONS:
			X: 8
			Y: (WINDOW_HEIGHT - HEIGHT) / 2
			Width: 48
			Height: 204
			Children:
				Button@ZOOM_IN_BUTTON:
					Width: 48
					Height: 48
					Font: Bold
				Button@ZOOM_OUT_BUTTON:
					Y: 52
					Width: 48
					Height: 48
					Font: Bold
				Button@ASSIGN_TOGGLE:
					Y: 104
					Width: 48
					Height: 48
					Font: Bold
				Button@CHAT_BUTTON:
					Y: 156
					Width: 48
					Height: 48
					Font: Bold
		Container@CONTROL_GROUPS_BAR:
			X: 360
			Y: WINDOW_HEIGHT - 52
			Width: 476
			Height: 44
			Children:
				Button@GROUP_TEMPLATE:
					Width: 44
					Height: 44
					Font: Bold
					Visible: false
